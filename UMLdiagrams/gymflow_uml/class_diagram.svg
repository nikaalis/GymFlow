<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">GymFlow class diagram</title><desc id="desc">Class relationships for users, reservations, resources, queues, maintenance, and the Coordinator.</desc>
<defs><style>.box{fill:#fff;stroke:#137f73;stroke-width:2}.head{fill:#dcf6f0}.line{stroke:#415e5a;stroke-width:2;fill:none}.t{font:16px Arial;fill:#173331}.h{font:bold 19px Arial;fill:#0a665d}.s{font:14px Arial;fill:#526b68}</style></defs>
<rect width="1200" height="760" fill="#f4f8f7"/>
<path class="line" d="M300 175H455M685 175H850M570 290V365M300 485H455M685 485H850M965 290V365"/>
<g transform="translate(65 70)"><rect class="box" width="235" height="220" rx="10"/><rect class="head" width="235" height="46" rx="10"/><text class="h" x="18" y="29">User</text><text class="t" x="18" y="76">username</text><text class="t" x="18" y="103">role</text><text class="t" x="18" y="130">no_show_count</text><text class="t" x="18" y="157">cancellation_count</text><text class="t" x="18" y="184">restricted_until</text><text class="s" x="18" y="209">is_booking_restricted</text></g>
<g transform="translate(455 70)"><rect class="box" width="230" height="220" rx="10"/><rect class="head" width="230" height="46" rx="10"/><text class="h" x="18" y="29">Reservation</text><text class="t" x="18" y="76">start_time</text><text class="t" x="18" y="103">end_time</text><text class="t" x="18" y="130">status</text><text class="t" x="18" y="157">priority</text><text class="t" x="18" y="184">check_in_at</text></g>
<g transform="translate(850 70)"><rect class="box" width="275" height="220" rx="10"/><rect class="head" width="275" height="46" rx="10"/><text class="h" x="18" y="29">PriorityQueueEntry</text><text class="t" x="18" y="82">priority</text><text class="t" x="18" y="112">created_at</text><text class="s" x="18" y="158">Ordered by priority, then FIFO</text></g>
<g transform="translate(65 365)"><rect class="box" width="235" height="220" rx="10"/><rect class="head" width="235" height="46" rx="10"/><text class="h" x="18" y="29">Area</text><text class="t" x="18" y="80">name</text><text class="t" x="18" y="110">max_capacity</text><text class="t" x="18" y="140">current_occupancy</text><text class="s" x="18" y="182">is_at_capacity</text></g>
<g transform="translate(455 365)"><rect class="box" width="230" height="220" rx="10"/><rect class="head" width="230" height="46" rx="10"/><text class="h" x="18" y="29">Resource</text><text class="t" x="18" y="76">name</text><text class="t" x="18" y="103">resource_type</text><text class="t" x="18" y="130">capacity</text><text class="t" x="18" y="157">reset_minutes</text><text class="t" x="18" y="184">maintenance status</text></g>
<g transform="translate(850 365)"><rect class="box" width="275" height="220" rx="10"/><rect class="head" width="275" height="46" rx="10"/><text class="h" x="18" y="29">MaintenanceWindow</text><text class="t" x="18" y="80">start_time</text><text class="t" x="18" y="110">end_time</text><text class="t" x="18" y="140">reason</text><text class="s" x="18" y="182">overlaps()</text></g>
<g transform="translate(410 640)"><rect x="0" y="0" class="box" width="380" height="75" rx="12"/><rect x="0" y="0" class="head" width="380" height="75" rx="12"/><text class="h" x="18" y="31">Coordinator</text><text class="s" x="18" y="56">availability · queue · check-in · no-show</text></g>
<path class="line" stroke-dasharray="7 5" d="M600 640V590M520 640L280 585M680 640L890 585"/>
<text class="s" x="335" y="162">1 to many</text><text class="s" x="720" y="162">0 or 1 queue entry</text><text class="s" x="335" y="472">1 to many</text><text class="s" x="720" y="472">1 to many</text>
</svg>
